<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Romantic Heart</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@400;600&display=swap');
    
    :root {
      --primary-color: #ff4d6d;
      --secondary-color: #ff8fa3;
      --accent-color: #ffb3c6;
      --text-color: #ffffff;
    }
    
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: linear-gradient(135deg, #fff0f3, #ffccd5);
      overflow: hidden;
      font-family: 'Montserrat', sans-serif;
      position: relative;
      cursor: pointer;
    }

    .vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, transparent 60%, rgba(0, 0, 0, 0.1));
      z-index: 1;
    }

    .heart-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 2;
    }

    svg {
      width: 70vw;
      max-width: 400px;
    }

    .heart-path {
      fill: url(#heartGradient);
      fill-opacity: 0;
      stroke: var(--primary-color);
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;
      animation: drawHeart 3.5s ease-in-out forwards, pulse 2s ease-in-out 3 3.5s;
      filter: drop-shadow(0 0 12px rgba(255, 79, 109, 0.4));
    }

    .heart-text, .name-text {
      fill: var(--text-color);
      text-anchor: middle;
      opacity: 0;
    }

    .heart-text {
      font-family: 'Dancing Script', cursive;
      font-size: 2.2rem;
      font-weight: bold;
      animation: fadeInText 3s ease-in-out forwards;
    }

    .name-text {
      font-family: 'Dancing Script', cursive;
      font-size: 2rem;
      font-weight: bold;
      animation: fadeInName 3.5s ease-in-out forwards;
    }

    .floral-decoration {
      position: absolute;
      width: 40px;
      height: 40px;
      opacity: 0;
      animation: fadeIn 2s forwards, floatUp 6s ease-in-out infinite;
    }

    .floral-decoration svg {
      width: 100%;
      height: 100%;
      fill: var(--secondary-color);
    }

    .floating-heart {
      position: absolute;
      font-size: 2rem;
      color: var(--primary-color);
      animation: floatHeart 1.8s ease-out forwards;
      user-select: none;
      pointer-events: none;
      z-index: 10;
    }

    /* Particles */
    .particle {
      position: absolute;
      background: var(--accent-color);
      border-radius: 50%;
      pointer-events: none;
      animation: floatParticle 15s linear infinite;
    }

    /* Animations */
    @keyframes drawHeart {
      0% { stroke-dashoffset: 1000; }
      60% { stroke-dashoffset: 0; fill-opacity: 0; }
      80% { fill-opacity: 1; }
      100% { stroke-dashoffset: 0; fill-opacity: 1; }
    }

    @keyframes fadeInText {
      0%, 70% { opacity: 0; transform: translateY(10px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInName {
      0%, 80% { opacity: 0; transform: translateY(10px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0% { transform: scale(1); filter: drop-shadow(0 0 12px rgba(255, 79, 109, 0.4)); }
      50% { transform: scale(1.05); filter: drop-shadow(0 0 16px rgba(255, 79, 109, 0.6)); }
      100% { transform: scale(1); filter: drop-shadow(0 0 12px rgba(255, 79, 109, 0.4)); }
    }

    @keyframes floatUp {
      0% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-20px) rotate(5deg); }
      100% { transform: translateY(0) rotate(0deg); }
    }

    @keyframes fadeIn {
      0% { opacity: 0; transform: scale(0.8); }
      100% { opacity: 0.8; transform: scale(1); }
    }

    @keyframes floatHeart {
      0% {
        opacity: 1;
        transform: translateY(0) scale(1) rotate(0deg);
      }
      100% {
        opacity: 0;
        transform: translateY(-120px) scale(1.8) rotate(15deg);
      }
    }

    @keyframes floatParticle {
      0% {
        transform: translateY(0) translateX(0) rotate(0deg);
        opacity: 0;
      }
      10% {
        opacity: 0.6;
      }
      90% {
        opacity: 0.6;
      }
      100% {
        transform: translateY(-100vh) translateX(20px) rotate(180deg);
        opacity: 0;
      }
    }

    /* Responsive adjustments */
    @media (max-width: 600px) {
      .heart-text {
        font-size: 1.8rem;
      }
      .name-text {
        font-size: 1.6rem;
      }
    }
  </style>
</head>
<body>

  <div class="vignette"></div>

  <div class="heart-container">
    <svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet">
      <defs>
        <linearGradient id="heartGradient" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="var(--secondary-color)"/>
          <stop offset="100%" stop-color="var(--primary-color)"/>
        </linearGradient>
      </defs>
      <path class="heart-path" d="M 200,100 C 150,60 100,90 100,140 C 100,200 160,220 200,250 C 240,220 300,200 300,140 C 300,90 250,60 200,100 Z"/>
      <text class="heart-text" x="200" y="150">I like you</text>
      <text class="name-text" x="200" y="190">Adrieli</text>
      <text class="name-text" x="200" y="230">"råtta"</text>
    </svg>
  </div>

  <!-- Floral decorations -->
  <div class="floral-decoration" style="top: 10%; left: 10%; animation-delay: 0.5s;">
    <svg viewBox="0 0 24 24">
      <path d="M12,2C13.1,2 14,2.9 14,4C14,5.1 13.1,6 12,6C10.9,6 10,5.1 10,4C10,2.9 10.9,2 12,2M15.5,8C16.3,8 17,8.7 17,9.5C17,10.3 16.3,11 15.5,11C14.7,11 14,10.3 14,9.5C14,8.7 14.7,8 15.5,8M8.5,8C9.3,8 10,8.7 10,9.5C10,10.3 9.3,11 8.5,11C7.7,11 7,10.3 7,9.5C7,8.7 7.7,8 8.5,8M12,11C13.1,11 14,11.9 14,13C14,14.1 13.1,15 12,15C10.9,15 10,14.1 10,13C10,11.9 10.9,11 12,11M19,17V19H5V17C5,14.8 8.1,13 12,13C15.9,13 19,14.8 19,17Z" />
    </svg>
  </div>
  <div class="floral-decoration" style="top: 15%; right: 15%; animation-delay: 0.8s;">
    <svg viewBox="0 0 24 24">
      <path d="M12,2C13.1,2 14,2.9 14,4C14,5.1 13.1,6 12,6C10.9,6 10,5.1 10,4C10,2.9 10.9,2 12,2M15.5,8C16.3,8 17,8.7 17,9.5C17,10.3 16.3,11 15.5,11C14.7,11 14,10.3 14,9.5C14,8.7 14.7,8 15.5,8M8.5,8C9.3,8 10,8.7 10,9.5C10,10.3 9.3,11 8.5,11C7.7,11 7,10.3 7,9.5C7,8.7 7.7,8 8.5,8M12,11C13.1,11 14,11.9 14,13C14,14.1 13.1,15 12,15C10.9,15 10,14.1 10,13C10,11.9 10.9,11 12,11M19,17V19H5V17C5,14.8 8.1,13 12,13C15.9,13 19,14.8 19,17Z" />
    </svg>
  </div>
  <div class="floral-decoration" style="bottom: 20%; left: 20%; animation-delay: 1.2s;">
    <svg viewBox="0 0 24 24">
      <path d="M12,3c2.2,0 4,1.8 4,4c0,2.1 -1.8,4 -4,4c-2.1,0 -4,-1.8 -4,-4c0,-2.2 1.8,-4 4,-4m0,2c-1.1,0 -2,0.9 -2,2c0,1.1 0.9,2 2,2c1.1,0 2,-0.9 2,-2c0,-1.1 -0.9,-2 -2,-2m-1,6h2v7h-2v-7z" />
    </svg>
  </div>
  <div class="floral-decoration" style="bottom: 15%; right: 15%; animation-delay: 1.5s;">
    <svg viewBox="0 0 24 24">
      <path d="M12,3c2.2,0 4,1.8 4,4c0,2.1 -1.8,4 -4,4c-2.1,0 -4,-1.8 -4,-4c0,-2.2 1.8,-4 4,-4m0,2c-1.1,0 -2,0.9 -2,2c0,1.1 0.9,2 2,2c1.1,0 2,-0.9 2,-2c0,-1.1 -0.9,-2 -2,-2m-1,6h2v7h-2v-7z" />
    </svg>
  </div>

  <script>
    // Create floating hearts on click
    document.body.addEventListener("click", function(e) {
      const heart = document.createElement("div");
      heart.className = "floating-heart";
      heart.innerHTML = "❤️";
      document.body.appendChild(heart);

      heart.style.left = `${e.clientX - 20}px`;
      heart.style.top = `${e.clientY - 20}px`;

      setTimeout(() => {
        heart.remove();
      }, 1800);
    });

    // Create floating particles
    function createParticles() {
      const particleCount = 15;
      
      for (let i = 0; i < particleCount; i++) {
        const particle = document.createElement("div");
        particle.className = "particle";
        
        const size = Math.random() * 6 + 2;
        const posX = Math.random() * window.innerWidth;
        const duration = Math.random() * 10 + 10;
        const delay = Math.random() * 15;
        
        particle.style.width = `${size}px`;
        particle.style.height = `${size}px`;
        particle.style.left = `${posX}px`;
        particle.style.bottom = `-10px`;
        particle.style.animationDuration = `${duration}s`;
        particle.style.animationDelay = `${delay}s`;
        
        document.body.appendChild(particle);
      }
    }

    // Initialize particles when page loads
    window.addEventListener("load", createParticles);
  </script>

</body>
</html>
